name: Events-API CI # The name of the process

on:
  push: # Trigger: Run whenever code is pushed
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest # Run on a fresh Linux machine in the cloud
    environment: Prod # Added during CD process

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        run: |
          docker build -t events-api:latest .

      - name: Run Container
        run: |
          docker run -d -p 5001:5001 --name events-api-test events-api:latest
          sleep 5
          curl http://localhost:5001/api/health || exit 1

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        run : |
          pytest -v

      - name: Cleanup
        if: always()
        run: |
          docker stop events-api-test
          docker rm events-api-test

      - name: login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag events-api:latest nemo0303d/events-api:latest
          docker tag events-api:latest nemo0303d/events-api:${{ github.sha }}

      - name: Push image to Docker Hub
        run: |
          docker push nemo0303d/events-api:latest
          docker push nemo0303d/events-api:${{ github.sha }}

      - name: Trigger render Re-deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOYMENT }}

